[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "yandex-disk-api-tests"
version = "1.0.0"
description = "Example API test project for the Yandex.Disk REST API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests==2.32.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --tb=short -p no:cacheprovider --strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: tests that call the live Yandex.Disk REST API",
]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
